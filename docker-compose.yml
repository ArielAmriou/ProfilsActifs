services:
  db:
    image: postgres:17
    container_name: postgres-pf
    networks:
      - backendnet
    env_file:
      - .env
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 10

  back-bun:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: bun-backend
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backendnet
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/var/videos:/usr/src/app/var/videos
    ports:
      - "8081:8081"
  
  front-bun:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: bun-frontend
    depends_on:
      - back-bun
    networks:
      - backendnet
    ports:
      - "3000:3000"

volumes:
  postgres:

networks:
  backendnet: