name: mirror.yml
on:
  pull_request:
    branches-ignore:
      - 'ga-ignore-*'
    types:
      - opened
  push:
    branches-ignore:
      - 'ga-ignore-*'

env:
  MIRROR_URL: "git@github.com:EpitechPGE3-2026/G-SVR-500-PAR-5-1-survivor-9.git"


jobs:
  check_valid_repo:
    runs-on: ubuntu-latest
    outputs:
      run_action: ${{ steps.valid.outputs.run_action }}
    steps:
      - name: Verify if in correct repositor
        id: valid
        if: ${{ !contains(env.MIRROR_URL, github.repository) }}
        run: echo "run_action=true" >> "$GITHUB_OUTPUT"

  push_to_mirror:
    needs: [check_valid_repo]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - name: Mirror
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            ${{ env.MIRROR_URL }}
          ssh_private_key:
            ${{ secrets.GIT_SSH_PRIVATE_KEY }}