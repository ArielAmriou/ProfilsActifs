name: Build & Package ProfilsActifs

on:
  push:
    branches:
      - build_artifact

jobs:
  build-and-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Recovery code
        uses: actions/checkout@v4

      - name: Check build Backend
        run: cd backend && docker build -t bun-backend .

      - name: Check build Frontend
        run: cd frontend && docker build -t bun-frontend .

      - name: Archive
        run: |
          mkdir profilsactifs-release
          cp -r backend frontend db docker-compose.yml readme.md profilsactifs-release/

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ProfilsActifs-Build
          path: profilsactifs-release/
          retention-days: 7