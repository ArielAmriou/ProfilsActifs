name: Build & Package Compétences+

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Recovery code
        uses: actions/checkout@v4

      - name: Check build Backend
        run: cd backend && docker build -t bun-backend .

      - name: Check build Frontend
        run: cd frontend && docker build -t bun-frontend .

      - name: setup archive
        run: |
          mkdir competences-plus-release
          cp -r backend frontend docker-compose.yml readme.md competences-plus-release/
          
          cp .env.example competences-plus-release/.env
          
          cp backend/.env.example competences-plus-release/backend/.env

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: Competences-Plus-Build
          path: competences-plus-release/
          include-hidden-files: true
          retention-days: 7